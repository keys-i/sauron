name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Enforce branch policy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node tools/scripts/branch.ts "$BRANCH"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript and Rust
        run: npm run check
      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --features wasm
      - name: Inspect npm package
        run: npm pack --dry-run
