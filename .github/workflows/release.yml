name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'keys-i/sauron' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Create Git release
        id: release
        uses: release-plz/action@346832d73e3415c2ebd0432cba3a2bf5881e5f7d # v0.5.135
        with:
          command: release
          version: 0.3.160
          manifest_path: Cargo.toml
          config: tools/config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Add deterministic fun name
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag="$(jq -r '.[0].tag' <<<"$RELEASES")"
          version="$(jq -r '.[0].version' <<<"$RELEASES")"
          title="$(node tools/scripts/name.ts "$version")"
          gh release edit "$tag" --title "Sauron v$version · $title"

  release-pr:
    if: github.repository == 'keys-i/sauron' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Open release PR
        uses: release-plz/action@346832d73e3415c2ebd0432cba3a2bf5881e5f7d # v0.5.135
        with:
          command: release-pr
          version: 0.3.160
          manifest_path: Cargo.toml
          config: tools/config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

  npm:
    if: github.repository == 'keys-i/sauron' && vars.RELEASE_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find releasable version
        id: package
        run: |
          git fetch --force --tags origin
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git show-ref --tags --verify --quiet "refs/tags/sauron-v$version"; then
            git checkout --detach "sauron-v$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.package.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install and verify
        if: steps.package.outputs.publish == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run size
      - name: Publish npm package
        if: steps.package.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@uqrealitylabs/sauron@$VERSION" version >/dev/null 2>&1; then
            exit 0
          fi
          npm version --no-git-tag-version "$VERSION"
          npm publish --access public --provenance
